<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python &amp; R Cheatsheets</title>
  <meta name="description" content="Личный справочник по Python и R для health data science и биоинформатики.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("cs-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Навигация">
      <div class="brand">
        <a href="#/" class="brand-link">
          <span class="brand-mark" aria-hidden="true">{ }</span>
          <span>Cheatsheets</span>
        </a>
        <button class="icon-btn" id="theme-btn" type="button" title="Тема: авто" aria-label="Переключить тему"></button>
      </div>

      <div class="lang-switch" role="tablist" aria-label="Язык">
        <button type="button" role="tab" data-lang="python">Python <span class="count"></span></button>
        <button type="button" role="tab" data-lang="r">R <span class="count"></span></button>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="search" placeholder="Поиск по шпаргалкам" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>

      <section class="pkg-filter">
        <div class="section-label">
          <span>Пакеты</span>
          <button type="button" class="link-btn" id="pkg-clear" hidden>сбросить</button>
        </div>
        <div class="chips" id="chips"></div>
      </section>

      <nav class="nav" id="nav"></nav>

      <footer class="sidebar-foot" id="sidebar-foot"></footer>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Меню">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <span class="topbar-title" id="topbar-title">Cheatsheets</span>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
