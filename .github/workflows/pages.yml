# Runs every code example, then builds the site and publishes it with GitHub Pages
# on every push to main. Pull requests only run the examples and validate the content.
# If an example fails, the site is not updated.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Find packages used by the examples
        id: deps
        run: |
          {
            echo "r<<EOF"
            python scripts/check_code.py --list-r-packages | sed 's/^/any::/'
            echo "EOF"
            echo "py=$(python scripts/check_code.py --list-py-packages)"
          } >> "$GITHUB_OUTPUT"
      - name: Install Python packages
        if: steps.deps.outputs.py != ''
        run: pip install ${{ steps.deps.outputs.py }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: ${{ steps.deps.outputs.r }}
      - name: Run all code examples and render plots
        run: python scripts/check_code.py --plots plots
      - uses: actions/upload-artifact@v7
        with:
          name: plots
          path: plots
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: actions/download-artifact@v8
        with:
          name: plots
          path: plots
        continue-on-error: true   # no plot blocks yet = no artifact
      - name: Validate content
        if: github.event_name == 'pull_request'
        run: python scripts/build.py --check
      - name: Build site
        if: github.event_name != 'pull_request'
        run: python scripts/build.py
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
